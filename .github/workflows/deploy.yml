name: QueueBot checks and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: queuebot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  unit:
    name: Unit tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.25.x'
      - name: Ensure deployment test shells are available
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zsh
          fi
      - name: Deployment and token rotation regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/workflows/tests -p 'test_*.py'
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=3m ./...

  integration:
    name: PostgreSQL integration and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queuebot
          POSTGRES_PASSWORD: queuebot_test
          POSTGRES_DB: queuebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queuebot -d queuebot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUEUEBOT_TEST_DATABASE_URL: postgres://queuebot:queuebot_test@localhost:5432/queuebot_test?sslmode=disable
      QUEUEBOT_REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.25.x'
      - run: go test -race -count=1 -timeout=5m ./...

  build:
    name: Binary and container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.25.x'
      - run: go build -trimpath -o "$RUNNER_TEMP/queue_bot" ./cmd/server
      - run: docker build --tag queuebot:ci .
      - name: Check container contents
        run: |
          docker run --rm --entrypoint /bin/sh queuebot:ci -ec '
            test -x /queue_bot
            test -s /app/config.yaml
            test -f /app/migrations/000001_create_schedules.up.sql
            test ! -e /app/.env
          '

  deploy:
    name: Deploy checked main commit
    concurrency:
      group: queuebot-production
      cancel-in-progress: false
    needs: [unit, integration, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.GO_BOT_SERVER_HOST }}
          username: ${{ secrets.GO_BOT_SERVER_USER }}
          key: ${{ secrets.GO_BOT_SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 20m
          script: |
            exec /bin/sh <<'QUEUEBOT_DEPLOY_SCRIPT'
            set +x
            set -eu
            exec 3>&1
            exec >/dev/null 2>&1
            deploy_outcome=failed
            trap 'deploy_status=$?; if [ "$deploy_status" -ne 0 ]; then deploy_outcome=failed; fi; printf "Deployment %s.\n" "$deploy_outcome" >&3; exit "$deploy_status"' 0
            umask 077
            deploy_log_dir="${QUEUEBOT_DEPLOY_STATE_DIR:-$HOME/.local/state/queuebot}"
            mkdir -p "$deploy_log_dir"
            chmod 700 "$deploy_log_dir"
            if [ -f "$deploy_log_dir/deploy.log" ]; then
              mv -f "$deploy_log_dir/deploy.log" "$deploy_log_dir/deploy.previous.log"
            fi
            if [ -f "$deploy_log_dir/deploy.previous.log" ]; then
              chmod 600 "$deploy_log_dir/deploy.previous.log"
            fi
            : > "$deploy_log_dir/deploy.log"
            chmod 600 "$deploy_log_dir/deploy.log"
            exec >"$deploy_log_dir/deploy.log" 2>&1
            cd "${QUEUEBOT_DEPLOY_DIR:-$HOME/queue-bot-go}"
            printf 'Deploying checked commit %s\n' "$DEPLOY_SHA"
            git fetch origin main
            deploy_current_sha="$(git rev-parse origin/main)"
            printf 'Current main: %s\n' "$deploy_current_sha"
            if [ "$deploy_current_sha" != "$DEPLOY_SHA" ]; then
              deploy_outcome='skipped (superseded commit)'
              exit 0
            fi
            git reset --hard "$DEPLOY_SHA"
            git clean -fd
            wait_for_ready() {
              queuebot_container="$1"
              queuebot_expected_state="$2"
              queuebot_state_format="$3"
              queuebot_attempt=0
              while [ "$queuebot_attempt" -lt 60 ]; do
                queuebot_state="$(docker inspect --format "$queuebot_state_format" "$queuebot_container")"
                printf '%s: %s\n' "$queuebot_container" "$queuebot_state"
                if [ "$queuebot_state" = "$queuebot_expected_state" ]; then
                  return 0
                fi
                queuebot_attempt=$((queuebot_attempt + 1))
                sleep 2
              done
              printf '%s did not become ready\n' "$queuebot_container"
              docker logs "$queuebot_container" --tail 30
              return 1
            }
            docker compose config --quiet
            docker compose build queuebot
            deploy_infra_images="$(docker compose config --images postgres pgadmin)"
            printf 'Infrastructure images:\n%s\n' "$deploy_infra_images"
            for deploy_image in $deploy_infra_images; do
              if ! docker image inspect "$deploy_image"; then
                docker pull "$deploy_image"
              fi
            done
            git fetch origin main
            deploy_current_sha="$(git rev-parse origin/main)"
            printf 'Current main after build: %s\n' "$deploy_current_sha"
            if [ "$deploy_current_sha" != "$DEPLOY_SHA" ]; then
              deploy_outcome='skipped (superseded commit)'
              exit 0
            fi
            docker compose stop queuebot
            docker compose up -d --no-build --pull never postgres pgadmin queuebot
            wait_for_ready queuebot 'running:false:healthy' '{{.State.Status}}:{{.State.Restarting}}:{{if .State.Health}}{{.State.Health.Status}}{{end}}'
            wait_for_ready queuebot_pgadmin 'running:false' '{{.State.Status}}:{{.State.Restarting}}'
            deploy_outcome=ready
            QUEUEBOT_DEPLOY_SCRIPT
